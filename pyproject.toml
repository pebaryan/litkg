[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litkg"
dynamic = ["version"]
description = "Catch fabricated, mismatched, and undefined citations in LaTeX and Markdown papers; explore your literature as an RDF graph."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "pebaryan" }]
keywords = ["citations", "bibtex", "latex", "references", "hallucination", "crossref", "mcp", "rdf", "sparql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "click>=8.1",
    "rdflib>=7.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
web = ["fastapi>=0.100", "uvicorn>=0.20"]
pdf = ["reportlab>=4.0"]
all = ["litkg[mcp,web,pdf]"]
dev = ["litkg[web,pdf]", "pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
litkg = "litkg.cli:main"

[project.urls]
Homepage = "https://github.com/pebaryan/litkg"
Issues = "https://github.com/pebaryan/litkg/issues"

[tool.setuptools]
packages = ["litkg"]

[tool.setuptools.dynamic]
version = { attr = "litkg.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP031"]
